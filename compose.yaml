name: remont

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.8-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log');
        define('WP_DEBUG_DISPLAY', false);
        define('WP_ENVIRONMENT_TYPE', 'local');
        // Локальная разработка: сайт открывается и с localhost, и с телефона в той же сети
        // (по IP компьютера). Разрешены только localhost и частные адреса 10.*, 172.16-31.*, 192.168.*.
        $$rmt_host = $$_SERVER['HTTP_HOST'] ?? '';
        if (preg_match('/^(localhost|127\.0\.0\.1|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+)(:\d+)?$$/', $$rmt_host)) {
          define('WP_HOME', 'http://' . $$rmt_host);
          define('WP_SITEURL', 'http://' . $$rmt_host);
        }
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/remont
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-remont.ini:ro

  # Служебный контейнер WP-CLI: запускается только командами из scripts/ (profile tools)
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/remont
      - ./seed:/seed:ro

volumes:
  db_data:
  wp_data:
